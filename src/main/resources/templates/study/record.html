<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 기록 - 일본어 단어장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container with-navbar">
        <div class="record-content">
            <!-- 사용자 정보 영역 -->
            <div class="user-info-section">
                <div class="user-info-content">
                    <div class="user-name" id="userName">로딩중...</div>
                    <button type="button" class="auth-btn" id="authBtn" onclick="handleAuth()" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path id="authIcon" d="" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span id="authText">로그인</span>
                    </button>
                </div>
            </div>

            <!-- 타이틀 -->
            <h1 class="record-title">
                학습 기록
                <span class="total-words-count" id="totalWordsCount" style="display: none;">
                    (총 <span id="totalWordsNumber">-</span>개)
                </span>
            </h1>

            <!-- GUEST 사용자 안내 메시지 -->
            <div class="guest-message" id="guestMessage" style="display: none;">
                <div class="guest-message-content">
                    <div class="guest-message-icon">📚</div>
                    <h3 class="guest-message-title">학습 기록을 확인하려면 로그인이 필요합니다</h3>
                    <p class="guest-message-text">
                        로그인하시면 개인 맞춤형 학습 기록을 확인하고<br>
                        복습 일정을 관리할 수 있습니다.
                    </p>
                    <button type="button" class="guest-login-btn" onclick="goToLogin()">
                        로그인하기
                    </button>
                </div>
            </div>

            <!-- 기록 목록 (로그인 사용자용) -->
            <div class="record-list" id="recordList">
                <!-- 단어 기록들이 여기에 동적으로 추가됩니다 -->
            </div>

            <!-- 로딩 애니메이션 -->
            <div class="loading-more" id="loadingMore" style="display: none;">
                <div class="loading-spinner"></div>
                <span class="loading-text">더 많은 기록을 불러오는 중...</span>
            </div>

            <!-- 더 이상 데이터가 없을 때 메시지 -->
            <div class="no-more-data" id="noMoreData" style="display: none;">
                더 이상 불러올 기록이 없습니다.
            </div>
        </div>
    </div>

    <!-- 네비게이션 바 -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/page/study/level" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z"/>
                    <polyline points="9,22 9,12 15,12 15,22"/>
                </svg>
                <span class="nav-label">메인</span>
            </a>
            <a href="/page/study/record" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                </svg>
                <span class="nav-label">기록</span>
            </a>
        </div>
    </nav>

    <script th:src="@{/js/api-client.js}"></script>
    <script th:src="@{/js/user-manager.js}"></script>
    <script th:src="@{/js/record.js}"></script>
</body>
</html>
