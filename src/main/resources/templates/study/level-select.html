<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레벨 선택 - 일본어 단어장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container with-navbar">
        <div class="level-content with-navbar">
            <!-- 뒤로가기 버튼 -->
            <button type="button" class="back-btn" onclick="goToModeSelect()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- 사용자 정보 영역 -->
            <div class="user-info-section">
                <div class="user-info-content">
                    <div class="user-name" id="userName">로딩중...</div>
                    <button type="button" class="auth-btn" id="authBtn" onclick="handleAuth()" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path id="authIcon" d="" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span id="authText">로그인</span>
                    </button>
                </div>
            </div>

            <!-- 타이틀 -->
            <h1 class="level-title">일본어 단어장</h1>

            <!-- GUEST 사용자 안내 메시지 -->
            <div class="level-guest-info" id="levelGuestInfo" style="display: none;">
                <span class="level-guest-info-icon">🎯</span>
                <p class="level-guest-info-text">
                    <span class="level-guest-info-highlight">로그인</span> 후에는 사용자 맞춤 학습을 제공합니다!<br>
                    학습 진도와 복습 일정을 관리하실 수 있어요.
                </p>
            </div>

            <!-- 단어 개수 선택 -->
            <div class="word-count-section">
                <label for="wordCount" class="word-count-label">학습할 단어 개수</label>
                <input type="number" id="wordCount" class="word-count-input" value="20" min="5" max="100" step="5">
            </div>

            <!-- 레벨 선택 버튼들 -->
            <div class="level-buttons">
                <button type="button" class="level-btn" onclick="startStudy('N5')">
                    <span class="level-text">N5</span>
                    <span class="arrow">›</span>
                </button>

                <button type="button" class="level-btn" onclick="startStudy('N4')">
                    <span class="level-text">N4</span>
                    <span class="arrow">›</span>
                </button>

                <button type="button" class="level-btn" onclick="startStudy('N3')">
                    <span class="level-text">N3</span>
                    <span class="arrow">›</span>
                </button>

                <button type="button" class="level-btn" onclick="startStudy('N2')">
                    <span class="level-text">N2</span>
                    <span class="arrow">›</span>
                </button>

                <button type="button" class="level-btn" onclick="startStudy('N1')">
                    <span class="level-text">N1</span>
                    <span class="arrow">›</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 네비게이션 바 -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/page/study/level" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z"/>
                    <polyline points="9,22 9,12 15,12 15,22"/>
                </svg>
                <span class="nav-label">메인</span>
            </a>
            <a href="/page/study/record" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                </svg>
                <span class="nav-label">기록</span>
            </a>
        </div>
    </nav>

    <script th:src="@{/js/api-client.js}"></script>
    <script th:src="@{/js/user-manager.js}"></script>
    <script th:src="@{/js/level-select.js}"></script>
</body>
</html>
