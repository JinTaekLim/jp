<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 모드 선택 - 일본어 단어장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container with-navbar">
        <div class="level-content with-navbar">
            <!-- 사용자 정보 영역 -->
            <div class="user-info-section">
                <div class="user-info-content">
                    <div class="user-name" id="userName">로딩중...</div>
                    <button type="button" class="auth-btn" id="authBtn" onclick="handleAuth()" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path id="authIcon" d="" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span id="authText">로그인</span>
                    </button>
                </div>
            </div>

            <!-- 타이틀 -->
            <h1 class="level-title">학습 모드 선택</h1>

            <!-- 학습 모드 설명 -->
            <div class="mode-description">
                <p>원하는 학습 방식을 선택해주세요</p>
            </div>

            <!-- 학습 모드 선택 버튼들 -->
            <div class="mode-selection">
                <button type="button" class="mode-btn balanced-mode" onclick="selectStudyMode('balanced')">
                    <div class="mode-icon">⚖️</div>
                    <div class="mode-content">
                        <div class="mode-name">균등 학습</div>
                        <div class="mode-desc">목표 레벨까지의 모든 단어를<br>균등하게 분배하여 학습</div>
                    </div>
                </button>

                <button type="button" class="mode-btn individual-mode" onclick="selectStudyMode('individual')">
                    <div class="mode-icon">🎯</div>
                    <div class="mode-content">
                        <div class="mode-name">개별 학습</div>
                        <div class="mode-desc">선택한 레벨의 단어만<br>집중적으로 학습</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 파일들 -->
    <script th:src="@{/js/api-client.js}"></script>
    <script th:src="@{/js/user-manager.js}"></script>
    <script th:src="@{/js/study-mode-select.js}"></script>
</body>
</html>
