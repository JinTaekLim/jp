<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 단어장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <!-- 메인 타이틀 -->
            <h1 class="main-title">일본어 단어장</h1>

            <!-- あいうえお 애니메이션 -->
            <div class="hiragana-animation">
                <span class="hiragana-char" data-delay="0">あ</span>
                <span class="hiragana-char" data-delay="200">い</span>
                <span class="hiragana-char" data-delay="400">う</span>
                <span class="hiragana-char" data-delay="600">え</span>
                <span class="hiragana-char" data-delay="800">お</span>
            </div>

            <!-- 버튼들 -->
            <div class="button-group">
                <button type="button" class="btn btn-primary" onclick="location.href='/page/login'">
                    로그인
                </button>
                <button type="button" class="btn btn-secondary" onclick="location.href='/page/study/mode'">
                    비회원으로 시작하기
                </button>
                <a href="/page/signup" class="signup-link">회원가입</a>
            </div>
        </div>
    </div>
</body>
</html>
