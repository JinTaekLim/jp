spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  # Redis 테스트 설정
  data:
    redis:
      host: localhost
      port: 6379

  # 세션 설정 (테스트 환경에서는 메모리 사용)
  session:
    store-type: none

logging:
  level:
    org.springframework: ERROR
    com.jp: INFO
    org.hibernate: ERROR